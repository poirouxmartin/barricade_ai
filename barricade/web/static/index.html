<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Barricade</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <h1>Barricade</h1>
  <div id="topbar">
    <div id="p0" class="player"><span class="dot" style="background:#d64541"></span>P1 <span id="w0" class="wcount"></span></div>
    <div id="status">Loading...</div>
    <div id="p1" class="player"><span class="dot" style="background:#4169e1"></span>P2 <span id="w1" class="wcount"></span></div>
  </div>
  <canvas id="board" width="648" height="648"></canvas>
  <div id="controls">
    <button id="btn-new">New game</button>
    <button id="btn-mode">Mode: Move</button>
  </div>
  <p id="hint"></p>
</div>
<script src="main.js"></script>
</body>
</html>
